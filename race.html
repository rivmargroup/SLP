<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Race — SLP Activities Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2a33;
  --ink-soft: #4b5f6a;
  --muted: #7d8f97;
  --primary: #1f5f6b;
  --primary-dark: #143f48;
  --primary-light: #e7f1f1;
  --accent: #e08e45;
  --accent-soft: #fbe9d7;
  --bg: #f8f7f4;
  --card-bg: #ffffff;
  --border: #e7e4dd;
  --good: #2f8f5b;
  --good-bg: #e5f5ec;
  --bad: #c14b4b;
  --bad-bg: #fbe9e9;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(20, 40, 45, 0.06);
  --shadow-md: 0 12px 28px -8px rgba(20, 40, 45, 0.16);
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; }

header.site-header {
  background: radial-gradient(1100px 420px at 85% -10%, rgba(224, 142, 69, 0.18), transparent 60%),
    linear-gradient(160deg, var(--primary-dark), var(--primary) 78%);
  color: white;
  padding: 34px 0 40px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-size: 0.86rem;
  font-weight: 600;
  margin-bottom: 18px;
}
.back-link:hover { color: white; }
.eyebrow {
  margin: 0 0 4px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent-soft);
  opacity: 0.9;
}
header.site-header h1 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 2rem;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
header.site-header p.sub {
  margin: 0 0 20px;
  color: rgba(255,255,255,0.85);
  max-width: 560px;
  font-size: 0.98rem;
}
.pill-row { display: flex; gap: 10px; flex-wrap: wrap; }
.pill {
  padding: 8px 16px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel {
  margin-top: -22px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 22px;
  position: relative;
  z-index: 1;
}

.setup-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 18px;
  border-bottom: 1px dashed var(--border);
}
.mode-toggle {
  display: flex;
  gap: 8px;
}
.mode-btn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
}
.mode-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.chip.active { background: var(--primary); border-color: var(--primary); color: white; }

.turn-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  margin-bottom: 18px;
}
.turn-banner .token { font-size: 1.3rem; }

/* Board */
.board-scroll {
  overflow-x: auto;
  padding: 6px 2px 16px;
  margin-bottom: 20px;
}
.board {
  display: flex;
  gap: 6px;
  width: max-content;
}
.tile {
  width: 52px;
  height: 62px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 700;
  position: relative;
  gap: 2px;
}
.tile.start, .tile.finish {
  background: var(--primary);
  color: white;
  font-size: 0.62rem;
  border-color: var(--primary);
}
.tile.finish { background: var(--accent); border-color: var(--accent); }
.tile .tokens { font-size: 1.25rem; line-height: 1; }
.tile .num { font-size: 0.68rem; }

.prompt-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 22px;
  text-align: center;
}
.prompt-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary-light);
  color: var(--primary-dark);
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 14px;
}
.prompt-text {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 22px;
  line-height: 1.4;
}

.action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.action-btn {
  font: inherit;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 13px 22px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: transform 0.1s ease;
}
.action-btn:active { transform: scale(0.97); }
.btn-good { background: var(--good-bg); color: var(--good); border: 2px solid var(--good); }
.btn-bad { background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); }
.btn-dice { background: var(--accent); color: white; }
.btn-next { background: var(--primary); color: white; }

.dice-result {
  margin: 16px 0;
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--primary-dark);
}
.feedback-msg {
  margin: 0 0 6px;
  font-weight: 700;
  font-size: 1rem;
}
.feedback-msg.good { color: var(--good); }
.feedback-msg.bad { color: var(--bad); }

.win-banner {
  display: none;
  text-align: center;
  padding: 30px 20px;
}
.win-banner.show { display: block; }
.win-banner h2 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--primary-dark);
  margin: 0 0 8px;
}
.win-banner p { color: var(--ink-soft); margin: 0 0 20px; }

@media (max-width: 560px) {
  header.site-header h1 { font-size: 1.6rem; }
  .prompt-text { font-size: 1.15rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="back-link" href="index.html">&larr; Back to Games</a>
    <p class="eyebrow">Speech &amp; language practice</p>
    <h1>🎲 Board Race</h1>
    <p class="sub">Answer the prompt, roll the dice, and race to the finish! Great for 1 or 2 players, self-graded by the clinician.</p>
    <div class="pill-row">
      <span class="pill" id="turnPill">🐢 Player 1's turn</span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">

    <div class="setup-row">
      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" data-players="1">🧑 1 Player</button>
        <button type="button" class="mode-btn" data-players="2">🧑🧑 2 Players</button>
      </div>
      <button type="button" class="mode-btn" id="resetBtn">🔄 Reset board</button>
    </div>

    <div class="chip-group" id="categoryChips"></div>

    <div class="board-scroll">
      <div class="board" id="board"></div>
    </div>

    <div id="gameArea">
      <div class="prompt-card" id="promptCard">
        <span class="prompt-label" id="promptCategory">Category</span>
        <p class="prompt-text" id="promptText">Prompt goes here</p>

        <div id="answerStage" class="action-row">
          <button type="button" class="action-btn btn-good" id="correctBtn">✅ Got it right</button>
          <button type="button" class="action-btn btn-bad" id="tryAgainBtn">🔁 Needs practice</button>
        </div>

        <div id="feedbackStage" style="display:none;">
          <p class="feedback-msg" id="feedbackMsg"></p>
          <div id="diceStage" class="action-row" style="display:none;">
            <button type="button" class="action-btn btn-dice" id="rollBtn">🎲 Roll dice</button>
          </div>
          <div class="dice-result" id="diceResult"></div>
          <div id="nextStage" class="action-row" style="display:none;">
            <button type="button" class="action-btn btn-next" id="nextBtn">Next turn &rarr;</button>
          </div>
        </div>
      </div>

      <div class="win-banner" id="winBanner">
        <h2 id="winText">🎉 Player 1 wins!</h2>
        <p>Great job practicing! Ready for a rematch?</p>
        <button type="button" class="action-btn btn-next" id="playAgainBtn">🔄 Play again</button>
      </div>
    </div>

  </section>
</main>

<script>
const CATEGORY_META = {
  Describing: { label: 'Describing', icon: '🔎' },
  Grammar: { label: 'Grammar', icon: '✏️' },
  Following_Directions_Conceptos_Espaciales: { label: 'Spatial concepts', icon: '🧭' },
  Following_Directions_Conceptos_Cuantitativos: { label: 'Quantity concepts', icon: '🔢' },
  WH_Questions: { label: 'WH questions', icon: '❓' }
};

const PROMPTS = [
  { category: 'Describing', prompt: 'Describe your favorite animal without saying its name. Give at least 3 clues.' },
  { category: 'Describing', prompt: 'Pick an object in the room and describe its shape, color, and size.' },
  { category: 'Describing', prompt: 'Describe a birthday cake to someone who has never seen one.' },
  { category: 'Describing', prompt: 'Think of a fruit. Describe how it looks, feels, and tastes.' },
  { category: 'Describing', prompt: 'Describe what a school bus looks like and what it is used for.' },

  { category: 'Grammar', prompt: "Make a sentence using 'is' to describe what someone is doing right now." },
  { category: 'Grammar', prompt: "Make a sentence using 'are' to describe what two people are doing." },
  { category: 'Grammar', prompt: "Finish this sentence correctly: 'He ___ (have/has) a red backpack.'" },
  { category: 'Grammar', prompt: "Make a sentence using the past tense of the word 'run'." },
  { category: 'Grammar', prompt: "Make a sentence using 'was' or 'were' to talk about yesterday." },

  { category: 'Following_Directions_Conceptos_Espaciales', prompt: "Tell where you could hide a toy so a friend could find it — use the word 'under' or 'behind'." },
  { category: 'Following_Directions_Conceptos_Espaciales', prompt: 'Describe where your feet are compared to your head.' },
  { category: 'Following_Directions_Conceptos_Espaciales', prompt: "Give a direction using the word 'next to' or 'between'." },
  { category: 'Following_Directions_Conceptos_Espaciales', prompt: "Tell someone how to put a book 'on top of' a table." },
  { category: 'Following_Directions_Conceptos_Espaciales', prompt: 'Describe where the ceiling is compared to the floor.' },

  { category: 'Following_Directions_Conceptos_Cuantitativos', prompt: "Name two groups of things and tell which one has 'more.'" },
  { category: 'Following_Directions_Conceptos_Cuantitativos', prompt: "Tell about a time you had 'less' of something than a friend." },
  { category: 'Following_Directions_Conceptos_Cuantitativos', prompt: "Explain what it means for two groups to be 'the same' amount." },
  { category: 'Following_Directions_Conceptos_Cuantitativos', prompt: "Name something you could have 'a lot' of and something you could have 'a little' of." },
  { category: 'Following_Directions_Conceptos_Cuantitativos', prompt: "If you have 3 cookies and your friend has 5, who has 'more'?" },

  { category: 'WH_Questions', prompt: "Ask a 'who' question about someone in your family." },
  { category: 'WH_Questions', prompt: "Ask a 'what' question about something you did today." },
  { category: 'WH_Questions', prompt: "Ask a 'where' question about a place you like to visit." },
  { category: 'WH_Questions', prompt: "Ask a 'when' question about something that happens every day." },
  { category: 'WH_Questions', prompt: "Ask a 'why' question about something that made you happy." }
];

const TOKENS = ['🐢', '🦊'];
const FINISH = 21;

let numPlayers = 1;
let positions = [0, 0];
let currentPlayer = 0;
let activeCategory = 'all';
let pool = [];
let pendingCorrect = false;

const board = document.getElementById('board');
const categoryChips = document.getElementById('categoryChips');
const modeToggle = document.getElementById('modeToggle');
const resetBtn = document.getElementById('resetBtn');
const turnPill = document.getElementById('turnPill');

const promptCard = document.getElementById('promptCard');
const promptCategory = document.getElementById('promptCategory');
const promptText = document.getElementById('promptText');
const answerStage = document.getElementById('answerStage');
const feedbackStage = document.getElementById('feedbackStage');
const feedbackMsg = document.getElementById('feedbackMsg');
const diceStage = document.getElementById('diceStage');
const diceResult = document.getElementById('diceResult');
const nextStage = document.getElementById('nextStage');
const winBanner = document.getElementById('winBanner');
const winText = document.getElementById('winText');

const correctBtn = document.getElementById('correctBtn');
const tryAgainBtn = document.getElementById('tryAgainBtn');
const rollBtn = document.getElementById('rollBtn');
const nextBtn = document.getElementById('nextBtn');
const playAgainBtn = document.getElementById('playAgainBtn');

function buildChips() {
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'chip active';
  allChip.textContent = '✨ All skills';
  allChip.dataset.value = 'all';
  allChip.addEventListener('click', () => selectCategory('all', allChip));
  categoryChips.appendChild(allChip);

  Object.keys(CATEGORY_META).forEach(key => {
    const meta = CATEGORY_META[key];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = `${meta.icon} ${meta.label}`;
    btn.dataset.value = key;
    btn.addEventListener('click', () => selectCategory(key, btn));
    categoryChips.appendChild(btn);
  });
}

function selectCategory(value, el) {
  activeCategory = value;
  [...categoryChips.children].forEach(c => c.classList.toggle('active', c === el));
  rebuildPool();
  loadPrompt();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rebuildPool() {
  const source = activeCategory === 'all' ? PROMPTS : PROMPTS.filter(p => p.category === activeCategory);
  pool = shuffle(source);
}

function buildBoard() {
  board.innerHTML = '';
  for (let i = 0; i <= FINISH; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.pos = i;
    if (i === 0) {
      tile.classList.add('start');
      tile.innerHTML = '<span class="num">START</span>';
    } else if (i === FINISH) {
      tile.classList.add('finish');
      tile.innerHTML = '<span class="num">FINISH</span>';
    } else {
      tile.innerHTML = `<span class="num">${i}</span>`;
    }
    const tokenSpan = document.createElement('span');
    tokenSpan.className = 'tokens';
    tile.appendChild(tokenSpan);
    board.appendChild(tile);
  }
  renderTokens();
}

function renderTokens() {
  [...board.children].forEach(tile => {
    const pos = Number(tile.dataset.pos);
    const tokenSpan = tile.querySelector('.tokens');
    let tokens = '';
    for (let p = 0; p < numPlayers; p++) {
      if (positions[p] === pos) tokens += TOKENS[p];
    }
    tokenSpan.textContent = tokens;
  });
}

function loadPrompt() {
  if (pool.length === 0) rebuildPool();
  const item = pool.pop();
  const meta = CATEGORY_META[item.category];
  promptCategory.textContent = `${meta.icon} ${meta.label}`;
  promptText.textContent = item.prompt;

  answerStage.style.display = 'flex';
  feedbackStage.style.display = 'none';
  diceStage.style.display = 'none';
  nextStage.style.display = 'none';
  diceResult.textContent = '';
  feedbackMsg.textContent = '';
  pendingCorrect = false;

  updateTurnPill();
}

function updateTurnPill() {
  turnPill.textContent = `${TOKENS[currentPlayer]} Player ${currentPlayer + 1}'s turn`;
}

function handleAnswer(correct) {
  answerStage.style.display = 'none';
  feedbackStage.style.display = 'block';
  pendingCorrect = correct;

  if (correct) {
    feedbackMsg.textContent = 'Nice work! Roll the dice to move ahead.';
    feedbackMsg.className = 'feedback-msg good';
    diceStage.style.display = 'flex';
  } else {
    feedbackMsg.textContent = "That's okay — let's practice more next turn!";
    feedbackMsg.className = 'feedback-msg bad';
    nextStage.style.display = 'flex';
  }
}

function rollDice() {
  const roll = Math.floor(Math.random() * 6) + 1;
  diceResult.textContent = `🎲 ${roll}`;
  diceStage.style.display = 'none';

  positions[currentPlayer] = Math.min(FINISH, positions[currentPlayer] + roll);
  renderTokens();

  if (positions[currentPlayer] >= FINISH) {
    showWin();
  } else {
    nextStage.style.display = 'flex';
  }
}

function showWin() {
  promptCard.style.display = 'none';
  winBanner.classList.add('show');
  winText.textContent = `🎉 Player ${currentPlayer + 1} wins!`;
}

function nextTurn() {
  currentPlayer = numPlayers === 2 ? (currentPlayer + 1) % 2 : 0;
  loadPrompt();
}

function resetGame() {
  positions = [0, 0];
  currentPlayer = 0;
  promptCard.style.display = 'block';
  winBanner.classList.remove('show');
  renderTokens();
  rebuildPool();
  loadPrompt();
}

correctBtn.addEventListener('click', () => handleAnswer(true));
tryAgainBtn.addEventListener('click', () => handleAnswer(false));
rollBtn.addEventListener('click', rollDice);
nextBtn.addEventListener('click', nextTurn);
playAgainBtn.addEventListener('click', resetGame);
resetBtn.addEventListener('click', resetGame);

modeToggle.addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  numPlayers = Number(btn.dataset.players);
  [...modeToggle.children].forEach(c => c.classList.toggle('active', c === btn));
  resetGame();
});

buildChips();
buildBoard();
rebuildPool();
loadPrompt();
</script>
</body>
</html>

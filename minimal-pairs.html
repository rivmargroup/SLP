<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Pairs — SLP Activities Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b2a3d; --ink-soft: #5a5872; --muted: #8b8aa0;
  --primary: #1f5f6b; --primary-dark: #143f48;
  --bg: #fbf8f2; --card-bg: #ffffff; --border: #ece7f5;
  --good: #1fa971; --good-bg: #e2faef; --bad: #ef5b5b; --bad-bg: #ffe9e9;
  --radius-lg: 26px; --radius-md: 18px;
  --shadow-md: 0 14px 30px -10px rgba(43,42,61,.18);
  --font-display: "Baloo 2", "Trebuchet MS", "Verdana", sans-serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin:0; font-family: var(--font-body); background: var(--bg); color: var(--ink); overflow-x:hidden;
}
body::before, body::after {
  content:''; position:fixed; border-radius:50%; filter: blur(70px); opacity:.4; z-index:-1;
}
body::before { width:360px; height:360px; background:#a5f3fc; top:-100px; right:-100px; }
body::after { width:400px; height:400px; background:#ddd6fe; bottom:-120px; left:-120px; }

.wrap { max-width: 820px; margin:0 auto; padding: 0 20px 60px; }

header {
  background: linear-gradient(155deg, var(--primary-dark), var(--primary) 80%);
  color:#fff; padding: 30px 0 46px; margin-bottom: -30px;
  border-radius: 0 0 40px 40px;
  position: relative;
  overflow: hidden;
}

.bg-floaties { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.floaty { position:absolute; opacity:0; animation: floatUp linear infinite; will-change: transform, opacity; }
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
  12%  { opacity:.6; }
  88%  { opacity:.5; }
  100% { transform: translateY(-190px) translateX(var(--drift,10px)) rotate(30deg); opacity:0; }
}

.mascot-track { position:absolute; left:0; right:0; bottom:0; height:40px; overflow:hidden; pointer-events:none; z-index:0; }
.mascot-patrol { position:absolute; left:0; top:0; animation: patrol 8s ease-in-out infinite; }
@keyframes patrol {
  0%   { left:0%;  transform: scaleX(1); }
  45%  { left:82%; transform: scaleX(1); }
  50%  { left:82%; transform: scaleX(-1); }
  95%  { left:0%;  transform: scaleX(-1); }
  100% { left:0%;  transform: scaleX(1); }
}
.mascot-patrol .walker { display:inline-block; font-size:1.6rem; animation: walkBob .4s ease-in-out infinite; }
@keyframes walkBob { 0%,100%{ transform: translateY(0) rotate(-3deg);} 50%{ transform: translateY(-8px) rotate(3deg);} }

.celebrate-overlay { position: fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:1200; opacity:0; transition: opacity .3s ease; }
.celebrate-overlay.show { opacity:1; }
.celebrate-banner {
  font-family: var(--font-display); font-weight:800; font-size: 1.9rem; color:#fff; text-align:center;
  background: linear-gradient(135deg, #06b6d4, #9b6bff);
  padding: 20px 38px; border-radius: 26px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.35);
  transform: scale(0); animation: bannerPop .6s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes bannerPop { 0%{ transform: scale(0) rotate(-8deg);} 60%{ transform: scale(1.12) rotate(3deg);} 100%{ transform: scale(1) rotate(0deg);} }
.spark-piece { position:fixed; pointer-events:none; z-index:1201; font-size:1.4rem; animation: sparkOut ease-out forwards; }
@keyframes sparkOut { 0%{ transform: translate(0,0) scale(0) rotate(0deg); opacity:1;} 100%{ transform: translate(var(--sx), var(--sy)) scale(1) rotate(var(--sr)); opacity:0;} }
header .wrap { display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap:wrap; }
.back-link { color: rgba(255,255,255,.85); text-decoration:none; font-size:.85rem; font-weight:700; font-family: var(--font-display); }
.back-link:hover { color:#fff; }
h1 { font-family: var(--font-display); font-weight:800; margin:8px 0 0; font-size: 1.9rem; display:flex; align-items:center; gap:10px; }
.mascot { display:inline-block; animation: bounce 2.2s ease-in-out infinite; font-size: 1.6rem; }
@keyframes bounce { 0%,100%{ transform: translateY(0) rotate(-4deg);} 50%{ transform: translateY(-9px) rotate(4deg);} }
.eyebrow { margin:0; font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color: #c7f9ff; font-family: var(--font-display); }
.scoreboard { display:flex; gap:10px; }
.pill {
  background: rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.25); border-radius:999px;
  padding:9px 18px; font-size:.88rem; font-weight:800; font-family: var(--font-display); transition: transform .2s ease;
}
.pill.pop { animation: pillPop .35s ease; }
@keyframes pillPop { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

.panel {
  margin-top: 30px; background: var(--card-bg); border:1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 30px; position:relative; z-index:1;
}

.chip-group { display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 24px; }
.chip {
  border:2px solid transparent; background: #f1eef9; color: var(--ink-soft);
  font-family: var(--font-display); font-size:.86rem; font-weight:700; padding:9px 16px; border-radius:999px; cursor:pointer;
  box-shadow: 0 3px 0 rgba(43,42,61,.08); transition: transform .1s ease, box-shadow .1s ease;
}
.chip:hover { transform: translateY(-1px); }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(43,42,61,.08); }
.chip.active { color: #fff; }

.prompt-card { text-align:center; padding: 16px 6px 24px; }
.prompt-label {
  display:inline-block; font-family: var(--font-display); font-size:.78rem; font-weight:800; letter-spacing:.04em;
  text-transform:uppercase; padding: 5px 14px; border-radius:999px; margin-bottom: 16px;
}
.hear-btn {
  display:flex; align-items:center; gap:8px; margin: 0 auto 18px; font-family: var(--font-display); font-weight:800;
  font-size:1.05rem; padding: 14px 28px; border-radius:999px; border:none; background: #06b6d4; color:#fff; cursor:pointer;
  box-shadow: 0 5px 0 #0891a8; transition: transform .1s ease, box-shadow .1s ease;
}
.hear-btn:hover { transform: translateY(-2px); }
.hear-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0891a8; }
.hear-btn .wave { display:inline-block; animation: wavePulse 1.2s ease-in-out infinite; }
@keyframes wavePulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.25);} }
.prompt-text { font-family: var(--font-display); font-size:1.25rem; font-weight:700; color: var(--ink-soft); margin: 0 0 26px; line-height:1.4; }

.options-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

.option-btn {
  font-family: inherit; font-size: 2rem; padding: 22px 10px; border-radius: var(--radius-md);
  border: 3px solid var(--border); background: #fff; cursor:pointer;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  min-height: 88px; display:flex; align-items:center; justify-content:center; word-break:break-word;
  box-shadow: 0 4px 0 var(--border);
  animation: popIn .35s ease both;
}
.option-btn:nth-child(1){ animation-delay:.02s }
.option-btn:nth-child(2){ animation-delay:.07s }
.option-btn:nth-child(3){ animation-delay:.12s }
.option-btn:nth-child(4){ animation-delay:.17s }
@keyframes popIn { from{ opacity:0; transform: scale(.82) translateY(8px);} to{ opacity:1; transform: scale(1) translateY(0);} }

.option-btn.word { font-size: 1.35rem; font-weight:800; font-family: var(--font-display); color: var(--ink); }
.option-btn:hover:not(:disabled) { border-color: #b3ebf2; transform: translateY(-3px); }
.option-btn.correct { background: var(--good-bg); border-color: var(--good); box-shadow: 0 4px 0 var(--good); animation: correctPop .45s ease; }
.option-btn.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake .5s ease; }
.option-btn:disabled { cursor:default; }
@keyframes correctPop { 0%{transform:scale(1)} 45%{transform:scale(1.1)} 100%{transform:scale(1)} }
@keyframes shake { 10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(5px)} 30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)} }

.feedback { text-align:center; min-height: 30px; margin-top:18px; font-weight:800; font-family: var(--font-display); }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.actions { display:flex; justify-content:center; gap:12px; margin-top: 18px; flex-wrap:wrap; }
.next-btn {
  font-family: var(--font-display); font-weight:800; font-size:1rem; padding: 14px 30px; border-radius:999px;
  border:none; background: var(--primary); color:#fff; cursor:pointer; visibility:hidden;
  box-shadow: 0 5px 0 var(--primary-dark); transition: transform .1s ease, box-shadow .1s ease;
}
.next-btn.visible { visibility: visible; }
.next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }

.confetti-piece { position:fixed; width:9px; height:9px; border-radius:3px; pointer-events:none; z-index:999; animation: confettiFall linear forwards; }
@keyframes confettiFall { to { transform: translate(var(--dx), 300px) rotate(var(--dr)); opacity:0; } }

.note-box {
  margin-top: 26px; background: #f4fbfc; border: 2px dashed #a5e6ef; border-radius: var(--radius-md);
  padding: 16px 20px; font-size: .88rem; color: var(--ink-soft); text-align:center;
}

@media (max-width: 500px) {
  .options-grid { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>

<header>
  <div class="bg-floaties" id="bgFloaties"></div>
  <div class="wrap">
    <div>
      <a class="back-link" href="index.html">&larr; All games</a>
      <p class="eyebrow">Speech &amp; language practice</p>
      <h1><span class="mascot">👂</span> Minimal Pairs</h1>
    </div>
    <div class="scoreboard">
      <span class="pill" id="scorePill">⭐ Score: 0</span>
      <span class="pill" id="streakPill">🔥 Streak: 0</span>
    </div>
  </div>
  <div class="mascot-track"><div class="mascot-patrol"><span class="walker">🐸</span></div></div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="chip-group" id="categoryChips"></div>

    <div class="prompt-card">
      <p class="prompt-label" id="promptCategory">Category</p>
      <button class="hear-btn" id="hearBtn" type="button"><span class="wave">🔊</span> Hear it</button>
      <p class="prompt-text" id="promptText">Loading...</p>
      <div class="options-grid" id="optionsGrid"></div>
      <p class="feedback" id="feedback"></p>
      <div class="actions">
        <button class="next-btn" id="nextBtn">Next word →</button>
      </div>
    </div>

    <p class="note-box">🎧 Best with sound on. Tap "Hear it" as many times as you need before choosing.</p>
  </div>
</div>

<script>
const CATEGORY_META = {
  Initial_Consonants: { label: 'Initial sounds', icon: '🔤', color: '#4d8dfa', soft: '#e8f0ff' },
  Final_Consonants: { label: 'Final sounds', icon: '🔡', color: '#ff6a6a', soft: '#ffe9e9' },
  Voicing: { label: 'Voicing', icon: '🎙️', color: '#17b897', soft: '#e2f9f2' },
  Clusters: { label: 'Clusters', icon: '🔗', color: '#9b6bff', soft: '#f1e9ff' }
};
const ALL_COLOR = '#06b6d4';

const WORD_SETS = [
  { category: 'Initial_Consonants', words: ['cat', 'bat', 'hat', 'mat'] },
  { category: 'Initial_Consonants', words: ['pig', 'big', 'dig', 'wig'] },
  { category: 'Initial_Consonants', words: ['fan', 'van', 'pan', 'tan'] },
  { category: 'Initial_Consonants', words: ['sip', 'ship', 'sit', 'zip'] },
  { category: 'Initial_Consonants', words: ['coat', 'goat', 'boat', 'moat'] },

  { category: 'Final_Consonants', words: ['cap', 'cat', 'can', 'cab'] },
  { category: 'Final_Consonants', words: ['bug', 'bun', 'bus', 'but'] },
  { category: 'Final_Consonants', words: ['pig', 'pin', 'pit', 'pick'] },
  { category: 'Final_Consonants', words: ['bed', 'beg', 'bell', 'bet'] },
  { category: 'Final_Consonants', words: ['dime', 'dine', 'dive', 'dice'] },

  { category: 'Voicing', words: ['bee', 'pea', 'tea', 'key'] },
  { category: 'Voicing', words: ['goat', 'coat', 'moat', 'boat'] },
  { category: 'Voicing', words: ['fan', 'van', 'tan', 'pan'] },
  { category: 'Voicing', words: ['sip', 'zip', 'tip', 'dip'] },
  { category: 'Voicing', words: ['time', 'dime', 'lime', 'mime'] },

  { category: 'Clusters', words: ['top', 'stop', 'shop', 'chop'] },
  { category: 'Clusters', words: ['pay', 'play', 'pray', 'clay'] },
  { category: 'Clusters', words: ['soon', 'spoon', 'swoon', 'moon'] },
  { category: 'Clusters', words: ['fee', 'free', 'flee', 'tree'] },
  { category: 'Clusters', words: ['boo', 'blue', 'brew', 'glue'] }
];

let activeCategory = 'all';
let pool = [];
let current = null;
let currentTargetWord = '';
let score = 0;
let streak = 0;
let answered = false;
let hasSpeech = 'speechSynthesis' in window;

const chipsEl = document.getElementById('categoryChips');
const promptCategoryEl = document.getElementById('promptCategory');
const promptTextEl = document.getElementById('promptText');
const optionsGridEl = document.getElementById('optionsGrid');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const hearBtn = document.getElementById('hearBtn');
const scorePill = document.getElementById('scorePill');
const streakPill = document.getElementById('streakPill');

function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  let R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
  R = R < 255 ? (R < 0 ? 0 : R) : 255; G = G < 255 ? (G < 0 ? 0 : G) : 255; B = B < 255 ? (B < 0 ? 0 : B) : 255;
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function popPill(el) {
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function confettiBurst(count) {
  const colors = ['#06b6d4', '#4d8dfa', '#ffb020', '#17b897', '#9b6bff', '#ff8fce'];
  const cx = window.innerWidth / 2;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.style.left = (cx + (Math.random() * 300 - 150)) + 'px';
    el.style.top = '110px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.setProperty('--dx', (Math.random() * 260 - 130) + 'px');
    el.style.setProperty('--dr', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDuration = (0.7 + Math.random() * 0.6) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}

function spawnFloaties(container, emojis, count) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'floaty';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (Math.random() * 90 + 2) + '%';
    el.style.bottom = '0px';
    el.style.fontSize = (0.9 + Math.random() * 0.9) + 'rem';
    el.style.setProperty('--drift', (Math.random() * 40 - 20) + 'px');
    el.style.animationDuration = (5 + Math.random() * 4) + 's';
    el.style.animationDelay = (Math.random() * 6) + 's';
    container.appendChild(el);
  }
}

function sparkleBurst(count) {
  const sparkles = ['✨', '⭐', '🌟', '💫'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'spark-piece';
    el.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
    el.style.left = cx + 'px'; el.style.top = cy + 'px';
    const angle = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 220;
    el.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    el.style.setProperty('--sr', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

function celebrateWin(message) {
  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay';
  overlay.innerHTML = `<div class="celebrate-banner">${message}</div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  sparkleBurst(50);
  confettiBurst(50);
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 400);
  }, 1900);
}

function buildChips() {
  const cats = ['all', ...Object.keys(CATEGORY_META)];
  cats.forEach(cat => {
    const color = cat === 'all' ? ALL_COLOR : CATEGORY_META[cat].color;
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === activeCategory ? ' active' : '');
    btn.type = 'button';
    btn.dataset.value = cat;
    btn.textContent = cat === 'all' ? '✨ All' : `${CATEGORY_META[cat].icon} ${CATEGORY_META[cat].label}`;
    if (cat === activeCategory) {
      btn.style.background = color;
      btn.style.boxShadow = `0 3px 0 ${shadeColor(color, -20)}`;
    }
    btn.addEventListener('click', () => {
      activeCategory = cat;
      [...chipsEl.children].forEach(c => {
        const isActive = c.dataset.value === cat;
        c.classList.toggle('active', isActive);
        const cColor = c.dataset.value === 'all' ? ALL_COLOR : CATEGORY_META[c.dataset.value].color;
        if (isActive) {
          c.style.background = cColor;
          c.style.boxShadow = `0 3px 0 ${shadeColor(cColor, -20)}`;
        } else {
          c.style.background = '';
          c.style.boxShadow = '';
        }
      });
      rebuildPool();
      nextQuestion();
    });
    chipsEl.appendChild(btn);
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rebuildPool() {
  const source = activeCategory === 'all' ? WORD_SETS : WORD_SETS.filter(q => q.category === activeCategory);
  pool = shuffle(source);
}

function speakWord(word) {
  if (!hasSpeech) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.rate = 0.82;
  utter.pitch = 1.05;
  utter.lang = 'en-US';
  window.speechSynthesis.speak(utter);
}

function nextQuestion() {
  answered = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextBtn.classList.remove('visible');

  if (pool.length === 0) rebuildPool();
  current = pool.pop();

  const meta = CATEGORY_META[current.category];
  promptCategoryEl.textContent = `${meta.icon} ${meta.label}`;
  promptCategoryEl.style.background = meta.soft;
  promptCategoryEl.style.color = meta.color;

  currentTargetWord = current.words[Math.floor(Math.random() * current.words.length)];

  promptTextEl.textContent = hasSpeech
    ? 'Press "Hear it," then tap the word you heard.'
    : `No audio on this browser — say aloud: "${currentTargetWord}", then tap the matching word.`;

  optionsGridEl.innerHTML = '';
  shuffle(current.words).forEach((w) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn word';
    btn.textContent = w;
    btn.addEventListener('click', () => selectOption(w, btn));
    optionsGridEl.appendChild(btn);
  });

  speakWord(currentTargetWord);
}

function selectOption(word, btn) {
  if (answered) return;
  answered = true;

  const buttons = [...optionsGridEl.children];
  buttons.forEach(b => (b.disabled = true));

  if (word === currentTargetWord) {
    btn.classList.add('correct');
    score++;
    streak++;
    feedbackEl.textContent = 'Correct! 🎉';
    feedbackEl.classList.add('good');
    confettiBurst(18);
  } else {
    btn.classList.add('wrong');
    const correctBtn = buttons.find(b => b.textContent === currentTargetWord);
    if (correctBtn) correctBtn.classList.add('correct');
    streak = 0;
    feedbackEl.textContent = `Not quite — the word was "${currentTargetWord}".`;
    feedbackEl.classList.add('bad');
  }

  scorePill.textContent = `⭐ Score: ${score}`;
  streakPill.textContent = `🔥 Streak: ${streak}`;
  popPill(scorePill);
  popPill(streakPill);
  nextBtn.classList.add('visible');

  if (streak > 0 && streak % 5 === 0) {
    celebrateWin(`🌟 ${streak} in a row! 🌟`);
  }
}

hearBtn.addEventListener('click', () => speakWord(currentTargetWord));
nextBtn.addEventListener('click', nextQuestion);

spawnFloaties(document.getElementById('bgFloaties'), ['✨', '⭐', '💫', '🌟'], 10);
buildChips();
rebuildPool();
nextQuestion();
</script>
</body>
</html>
